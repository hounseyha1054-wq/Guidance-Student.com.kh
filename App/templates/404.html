<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | CareerCompass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        :root {
            --primary: #4361ee;
            --accent: #7209b7;
            --transition: all 0.25s ease;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: var(--theme-transition);
        }
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.35);
        }
        .error-code {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #4361ee 0%, #7209b7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        [data-theme="dark"] body {
            background: linear-gradient(135deg, #0b1120 0%, #030712 100%) !important;
        }
        [data-theme="dark"] .error-card {
            background: rgba(17, 24, 39, 0.95) !important;
            border-color: #374151 !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6) !important;
        }
        .btn-modern {
            padding: 0.85rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary-modern {
            background: linear-gradient(135deg, #4361ee 0%, #3f37c9 100%);
            color: white;
            box-shadow: 0 6px 18px rgba(67, 97, 238, 0.35);
        }
        .btn-primary-modern:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.45);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="d-flex justify-content-end mb-3 gap-2">
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                <i class="bi bi-moon-stars-fill text-primary"></i>
            </button>
            <div class="dropdown">
                <button class="lang-selector-btn dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="lang-btn-text">🇺🇸 EN</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 py-2">
                    <li><button class="dropdown-item" onclick="setLanguage('en')">🇺🇸 English</button></li>
                    <li><button class="dropdown-item" onclick="setLanguage('kh')">🇰🇭 ភាសាខ្មែរ</button></li>
                </ul>
            </div>
        </div>

        <div class="error-badge">
            <i class="bi bi-compass"></i>
        </div>
        <div class="error-code">404</div>
        <h2 class="fw-bold mb-2" data-i18n="error_404_title">Page Not Found</h2>
        <p class="text-muted mb-4" data-i18n="error_404_desc">The page you are looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
        
        <div class="d-flex justify-content-center gap-2 flex-wrap">
            {% if session.get('is_admin') %}
            <a href="{{ url_for('auth.admin_dashboard') }}" class="btn-modern btn-primary-modern">
                <i class="bi bi-grid-1x2-fill"></i> <span data-i18n="btn_back_dashboard">Go to Dashboard</span>
            </a>
            {% elif session.get('user_id') %}
            <a href="{{ url_for('auth.account') }}" class="btn-modern btn-primary-modern">
                <i class="bi bi-person-badge"></i> <span data-i18n="nav_overview">Go to Portal</span>
            </a>
            {% else %}
            <a href="{{ url_for('auth.login') }}" class="btn-modern btn-primary-modern">
                <i class="bi bi-box-arrow-in-right"></i> <span>Go to Login</span>
            </a>
            {% endif %}
            <button onclick="history.back()" class="btn btn-outline-secondary rounded-pill px-4 fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Back
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/theme-lang.js') }}"></script>
</body>
</html>
