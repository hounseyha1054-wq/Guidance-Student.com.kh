services:
  - type: web
    name: student-guidance-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: student-guidance-db
          property: connectionString

databases:
  - name: student-guidance-db
    plan: free
    databaseName: studentguidance
    user: studentguidance_user
